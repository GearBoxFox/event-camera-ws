#Accelerometers
accelerometer_noise_density: 1.49e-03   #Noise density (continuous-time)
accelerometer_random_walk:   8.69e-05   #Bias random walk

#Gyroscopes
gyroscope_noise_density:     8.09e-05   #Noise density (continuous-time)
gyroscope_random_walk:       1.19e-06   #Bias random walk

rostopic:                    /dvxm/imu      #the IMU ROS topic
update_rate:                 200.0      #Hz (for discretization of the values above)